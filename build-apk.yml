name: Build APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Personal signing key (if secrets are set)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            echo "KS_FILE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"
            echo "KS_PASS=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "Using personal key"
          else
            echo "Using fallback key"
          fi
      - name: Build
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then VER="0.0"; fi
          gradle assembleDebug --no-daemon -PappVersion="$VER" -PappCode="${{ github.run_number }}"
      - name: Find APK
        run: |
          ls -R app/build/outputs || true
          APK=$(find . -name "*.apk" | head -n 1)
          echo "Found: $APK"
          cp "$APK" IV234.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IV234-apk
          path: IV234.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: IV234.apk
