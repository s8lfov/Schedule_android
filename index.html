<script>
const DAYS=["Понедельник","Вторник","Среда","Четверг","Пятница"];
const L=[
[1,0,"Физ.культура","","4,6,8,13-15","Волков В.В."],

[1,1,"МДК.05.02.","106л","1-13,16","Лукьянова С.П."],

[3,3,"МДК.05.01.","106л","13,16","Лукьянова С.П."],

[4,3,"Ин.язык","409 / 314","14,15","Кривцова С.Н. / Степаненко О.А."],

];

function parseWeeks(s){const o=new Set();s.split(",").forEach(p=>{const[a,b]=p.split("-").map(Number);for(let i=a;i<=(b||a);i++)o.add(i)});return o}
L.forEach(l=>l.w=parseWeeks(l[4]));

const DAY=864e5;
const utc=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
let now=new Date(),dow,effDay,realWeek,todayIdx,inRange;
const year=2026;
const sep1=new Date(year,8,1);
const mon1=utc(sep1)-((sep1.getDay()+6)%7)*DAY;
const START=Date.UTC(2026,8,1), END=Date.UTC(2026,11,31);
const maxWeek=Math.floor((END-mon1)/DAY/7)+1;
function calcNow(){now=new Date();dow=(now.getDay()+6)%7;effDay=utc(now)+(dow>=5?(7-dow)*DAY:0);realWeek=Math.floor((effDay-mon1)/DAY/7)+1;todayIdx=dow;inRange=utc(now)>=START&&utc(now)<=END}
const homeW=()=>inRange?realWeek:(utc(now)<START?1:maxWeek);
calcNow();let week=homeW();

const fmt=t=>new Date(t).toLocaleDateString("ru-RU",{day:"numeric",month:"long",timeZone:"UTC"});

function render(){
  const start=mon1+(week-1)*7*DAY, end=start+4*DAY;
  document.getElementById("num").textContent=week;
  document.getElementById("prev").disabled=week<=1;
  document.getElementById("next").disabled=week>=maxWeek;
  document.getElementById("range").textContent=fmt(start)+" – "+fmt(end);
  const sub=document.getElementById("sub");
  sub.textContent=(inRange&&week===realWeek?"Текущая неделя · ":"")+"учебный год 2026: с 1 сентября по 31 декабря"+(!inRange?" · сегодня вне периода расписания":"")+(week>17?" · занятий по расписанию нет":"");
  const isCur=inRange&&week===realWeek;
  const cp=curPair();
  let h="<thead><tr><th class='n'>№</th>";
  DAYS.forEach((d,i)=>{
    const dt=new Date(start+i*DAY);
    h+=`<th class="${isCur&&i===todayIdx?"today":""}">${d}${(OV[iso(start+i*DAY)]||MY[iso(start+i*DAY)])?" ✎":""}<br><span style="font-weight:400;font-size:12px">${dt.toLocaleDateString("ru-RU",{day:"numeric",month:"short",timeZone:"UTC"})}</span></th>`;
  });
  h+="</tr></thead><tbody>";
  for(let p=1;p<=5;p++){

function cleanAtt(a){

    for(const p in a[k]){if(!/^[1-5]$/.test(p)||!Array.isArray(a[k][p]))continue;

          const nm=typeof x.n==="string"?x.n.replace(/[<>"'\x00-\x1f]/g,"").slice(0,60):"";
          ((o[k]=o[k]||{})[p]=o[k][p]||[]).push({n:nm||"файл",u:x.u,t:x.t});n++}}}}

}
function cleanNotice(n){

const b64e=t=>btoa(unescape(encodeURIComponent(t)));
const b64d=t=>decodeURIComponent(escape(atob(t.replace(/\s/g,""))));

async function push(){
  const url="https://api.github.com/repos/"+GH_REPO+"/contents/"+GH_FILE;
  const revert=async()=>{rev=-1;stAt="";await pull()};
  try{
    const g=await fetch(url+"?ref="+GH_BRANCH+"&t="+Date.now(),{headers:ghH(tok),cache:"no-store"});
    if(g.status===401){tok=null;ls("iv_gh");await revert();return"Токен недействителен — войдите снова"}
    let sha,srv=null;
    if(g.ok){const j=await g.json();sha=j.sha;try{srv=JSON.parse(b64d(j.content))}catch(e){srv=null}}
    else if(g.status!==404){await revert();return"Ошибка чтения ("+g.status+")"}
    const cur=srv?(+srv.rev||0):0;
    if(cur!==rev){
      if(srv){
        applyState(srv);ls("iv_state",srv);render();
        if(srv.by&&srv.by.toLowerCase()===tuser.toLowerCase()){rev=cur}
        else{return"Расписание только что изменил другой админ. Данные обновлены — повторите правку"}
      }
    }
    const next={rev:Math.max(cur,rev)+1,bells:{mon:G.mon,tue:G.tue,wed:G.wed,thu:G.thu,fri:G.fri},ov:OV,sh:SH,att:ATT,notice:NOTICE,by:tuser,at:new Date().toISOString()};
    const body={message:"Расписание: правка от "+tuser,content:b64e(JSON.stringify(next)),branch:GH_BRANCH};
    if(sha)body.sha=sha;
    const p=await fetch(url,{method:"PUT",headers:{...ghH(tok),"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(p.status===409||p.status===422){await revert();return"Конфликт сохранения — повторите правку"}
    if(p.status===403||p.status===404){await revert();return"Нет прав на запись. У токена должно быть разрешение Contents: Read and write"}
    if(!p.ok){await revert();return"Ошибка сохранения ("+p.status+")"}
    applyState(next);ls("iv_state",next);render();
    return"Сохранено. У друзей обновится в течение пары минут";
  }catch(e){return"Нет связи с GitHub"}
}

async function sniff(f){
  const b=new Uint8Array(await f.slice(0,12).arrayBuffer());
  const at=(i,s)=>[...s].every((c,j)=>b[i+j]===c.charCodeAt(0));
  if(b[0]===0xFF&&b[1]===0xD8&&b[2]===0xFF)return"jpg";
  if(b[0]===0x89&&at(1,"PNG"))return"png";
  if(at(0,"RIFF")&&at(8,"WEBP"))return"webp";
  if(at(0,"%PDF-"))return"pdf";
  return null;
}

const ALLOW_PDF=true;
async function cleanImage(f,ext){
  let bmp;
  try{bmp=await createImageBitmap(f,{imageOrientation:"from-image"})}
  catch(e){try{bmp=await createImageBitmap(f)}catch(e2){return null}}
  const w0=bmp.width,h0=bmp.height;
  if(!w0||!h0||w0*h0>50e6){bmp.close();return null}
  const k=Math.min(1,2400/Math.max(w0,h0)),w=Math.max(1,Math.round(w0*k)),h=Math.max(1,Math.round(h0*k));
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d");
  if(ext==="jpg"){x.fillStyle="#fff";x.fillRect(0,0,w,h)}
  x.drawImage(bmp,0,0,w,h);bmp.close();
  const want=ext==="jpg"?"image/jpeg":ext==="webp"?"image/webp":"image/png";
  const blob=await new Promise(r=>c.toBlob(r,want,.88));
  if(!blob)return null;
  const out=blob.type==="image/jpeg"?"jpg":blob.type==="image/webp"?"webp":blob.type==="image/png"?"png":null;
  return out?{buf:await blob.arrayBuffer(),ext:out}:null;
}

const PDF_BAD=/\/(JavaScript|JS|Launch|OpenAction|AA|AcroForm|EmbeddedFiles?|FileAttachment|RichMedia|XFA|SubmitForm|ImportData|GoToR|GoToE|URI|Encrypt|Movie|Sound|3D|Rendition|Screen)(?![A-Za-z0-9])/;
const PDF_MSG="В PDF есть скрипты, ссылки, формы или вложенные файлы — такой файл прикрепить нельзя";
const latin=u=>{let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return s};
const unhex=s=>s.replace(/#([0-9A-Fa-f]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16)));

async function inflate(u8){
  try{
    const ds=new DecompressionStream("deflate"),w=ds.writable.getWriter();
    w.write(u8).catch(()=>{});w.close().catch(()=>{});
    const r=ds.readable.getReader(),parts=[];let n=0;
    for(;;){const x=await r.read();if(x.done)break;n+=x.value.length;if(n>8e6){r.cancel();return null}parts.push(x.value)}
    const all=new Uint8Array(n);let o=0;parts.forEach(p=>{all.set(p,o);o+=p.length});
    return latin(all);
  }catch(e){return null}
}

async function pdfCheck(buf){
  const u8=new Uint8Array(buf),t=latin(u8);
  if(!t.startsWith("%PDF-1.")&&!t.startsWith("%PDF-2."))return"Это не PDF-файл";
  if(!t.includes("%%EOF"))return"PDF повреждён";
  let i=0,struct="",last=0,objs=0;
  for(;;){
    const s=t.indexOf("stream",i);if(s<0)break;
    if(t.startsWith("endstream",s-3)){i=s+6;continue}
    let a=s+6;if(t[a]==="\r")a++;if(t[a]==="\n")a++;
    const e=t.indexOf("endstream",a);if(e<0)return"PDF повреждён";
    struct+=t.slice(last,a);last=e;
    const dict=t.slice(Math.max(0,t.lastIndexOf("obj",s)),s);
    if(dict.includes("/ObjStm")){
      if(++objs>200)return"Слишком сложный PDF";
      const m=/\/Length\s+(\d+)(?!\s+\d+\s+R)/.exec(dict),ends=[];
      if(m&&a+ +m[1]<=e)ends.push(a+ +m[1]);
      ends.push(e,e-1,e-2);
      let d=null;
      for(const en of ends){if(en>a){d=await inflate(u8.subarray(a,en));if(d!==null)break}}
      if(d===null)return"PDF с нестандартным сжатием не поддерживается";
      if(PDF_BAD.test(unhex(d)))return PDF_MSG;
    }
    i=e+9;
  }
  struct+=t.slice(last);
  return PDF_BAD.test(unhex(struct))?PDF_MSG:null;
}

async function prepareUpload(f){
  const ext=await sniff(f);
  if(!ext)return{err:"Допустимы только JPG, PNG, WEBP и PDF"};
  let buf,out=ext;
  if(ext==="pdf"){
    if(!ALLOW_PDF)return{err:"PDF отключены, можно прикреплять только фото"};
    buf=await f.arrayBuffer();
    const bad=await pdfCheck(buf);if(bad)return{err:bad};
  }else{
    const c=await cleanImage(f,ext);
    if(!c)return{err:"Изображение повреждено или не может быть безопасно обработано"};
    buf=c.buf;out=c.ext;
  }
  if(buf.byteLength>5*1024*1024)return{err:"После обработки файл больше 5 МБ"};
  return{buf,ext:out};
}

function b64buf(buf){const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
