name: Build APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check project files (and fix root build.gradle)
        run: |
          echo "=== root build.gradle (before) ==="; cat build.gradle || true
          printf "plugins {\n    id 'com.android.application' version '8.5.2' apply false\n}\n" > build.gradle
          echo "=== app/build.gradle (first lines) ==="; head -n 6 app/build.gradle || echo "app/build.gradle NOT FOUND"
          echo "=== files ==="; ls -la . app app/src/main || true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Personal signing key (if secrets are set)
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
            echo "KS_FILE=$RUNNER_TEMP/ks.jks" >> "$GITHUB_ENV"
            echo "KS_PASS=$KS_PASSWORD" >> "$GITHUB_ENV"
            echo "Using personal key"
          else
            echo "Using fallback key"
          fi
      - name: Bundle current schedule snapshot into the APK
        run: |
          # актуальное расписание берём прямо с GitHub (так же, как это делает приложение),
          # а если не вышло — из файла в репозитории
          BASE="https://raw.githubusercontent.com/${{ github.repository }}"
          GOT=""
          for BR in data main; do
            if curl -fsSL "$BASE/$BR/schedule.json?t=$(date +%s)" -o "$RUNNER_TEMP/schedule.json" \
               && python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$RUNNER_TEMP/schedule.json"; then
              GOT="$BR"; break
            fi
          done
          if [ -n "$GOT" ]; then
            cp "$RUNNER_TEMP/schedule.json" app/src/main/assets/schedule.json
            echo "Bundled schedule.json from GitHub (branch $GOT)"
          elif [ -f schedule.json ]; then
            cp schedule.json app/src/main/assets/schedule.json
            echo "Bundled schedule.json from the repository checkout"
          else
            echo "WARNING: schedule.json not found on GitHub - the APK will have only the base schedule until it downloads one"
          fi
      - name: Build
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then VER="0.0"; fi
          gradle assembleDebug --no-daemon -PappVersion="$VER" -PappCode="${{ github.run_number }}"
      - name: Find APK
        run: |
          ls -R app/build/outputs || true
          APK=$(find . -name "*.apk" | head -n 1)
          echo "Found: $APK"
          cp "$APK" IV234.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IV234-apk
          path: IV234.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: IV234.apk
