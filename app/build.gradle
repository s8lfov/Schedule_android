plugins {
    id 'com.android.application'
}
android {
    namespace 'com.iv234.schedule'
    compileSdk 34
    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    defaultConfig {
        applicationId "com.iv234.schedule"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt((project.findProperty("appCode") ?: "1").toString())
        versionName (project.findProperty("appVersion") ?: "1.0").toString()
    }
    buildTypes {
        debug {
            debuggable false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
