<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#6b7385;--line:#e2e5ee;--accent:#6d28d9;--hl:#f1eafd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1d2029;--text:#eceef4;--muted:#9aa1b3;--line:#313644;--accent:#8b5cf6;--hl:#2d2442}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1d2029;--text:#eceef4;--muted:#9aa1b3;--line:#313644;--accent:#8b5cf6;--hl:#2d2442}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 12px 40px}
.wrap{max-width:1200px;margin:0 auto}
.hero{text-align:center;margin:10px 0 24px}
.hero small{display:block;margin:4px 0 8px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.hero .num{font-size:clamp(64px,14vw,120px);font-weight:800;line-height:1;color:var(--accent)}
.hero .lbl{font-size:clamp(18px,3vw,26px);font-weight:600}
.hero .sub{color:var(--muted);margin-top:6px;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav{display:flex;justify-content:center;gap:8px;margin-top:18px;flex-wrap:wrap}
button:disabled{opacity:.4;cursor:default}
button:disabled:hover{border-color:var(--line)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer}
button:hover{border-color:var(--accent)}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed}
th,td{border:1px solid var(--line);padding:8px;vertical-align:top;font-size:13px}
th{background:var(--card);font-size:14px}
th.today{background:var(--accent);color:#fff}
td.today{background:var(--hl)}
th.n,td.n{width:42px;text-align:center;font-weight:700;color:var(--muted);vertical-align:middle}
.les{margin-bottom:8px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.les:last-child{margin:0;padding:0;border:0}
.les b{display:block;font-size:14px}
.les .r{color:var(--accent);font-weight:600}
.les .t{color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center}
td.off{background:var(--bg);opacity:.55}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:16px;width:min(560px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{padding:6px 12px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bt{min-width:0;table-layout:auto;margin-bottom:14px}
.bt th{text-align:left}
.bt tr.long td{background:#f5e663;color:#222}
.bt tr.cur td{outline:2px solid var(--accent);outline-offset:-2px;font-weight:700}
.bh{margin:6px 0;font-weight:700;color:var(--accent)}
#cards{display:none}
.dc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.dc.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.dc.off{opacity:.55}
.dh2{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:17px}
.dh2 span{color:var(--muted);font-size:13px}
.dc.today .dh2 b{color:var(--accent)}
.cp{padding:8px 0;border-top:1px solid var(--line)}
.ct{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
.ct b{color:var(--text)}
@media (max-width:760px){
 body{padding:12px 10px 32px}
 .scroll{display:none}
 #cards{display:block}
 .hero{margin:4px 0 16px}
 .nav button{flex:1 1 30%;padding:11px 8px}
 dialog{padding:12px;width:96vw}
 .bt td,.bt th{padding:6px 5px;font-size:12px}
 .les b{font-size:15px}
 .les .t{font-size:13px}
}
td.hol{text-align:center;vertical-align:middle;background:var(--hl)}
.hb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px}
.hb .hi{font-size:28px}
.hb b{font-size:15px}
.seeb{margin-top:6px;background:var(--accent);color:#fff;border-color:var(--accent);font-size:13px;padding:8px 12px}
.seeb:hover{opacity:.9}
.dc .hb{padding:6px 0}
td.now,.cp.now{box-shadow:inset 0 0 0 2px var(--accent);background:var(--hl)}
td.next,.cp.next{box-shadow:inset 0 0 0 1px var(--accent)}
td.now::before,td.next::before,.cp.now::before,.cp.next::before{content:attr(data-b);display:block;font-size:11px;font-weight:700;color:var(--accent);margin-bottom:4px}
#ac input,#ac textarea{font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
#ac input[type=checkbox]{width:auto}
.ar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.ap{margin:10px 0;padding:8px;border:1px solid var(--line);border-radius:10px}
.lr,.br{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap;align-items:center}
.lr input{flex:1 1 120px}.br input{flex:1 1 90px}
.lr input.s,.br input.s{flex:0 0 64px;width:64px}
#ac textarea{width:100%;font-family:monospace;font-size:12px}
.am{margin-top:6px;color:var(--accent);font-weight:600}
.shoe{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:999px;background:var(--hl);color:var(--accent);font-size:12px;font-weight:600}
.tg{display:flex;gap:8px;align-items:center;margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button id="bells">🔔 Звонки</button>
    <button id="admbtn">⚙ Админ</button>
  </div>
  <div class="hero">
    <div class="num" id="num">–</div>
    <small>Учебная неделя</small>
    <div class="lbl" id="range"></div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="scroll"><table id="tbl"></table></div>
  <div id="cards"></div>
  <div class="nav">
    <button id="prev">← Пред. неделя</button>
    <button id="cur">Сегодня</button>
    <button id="next">След. неделя →</button>
  </div>
  <dialog id="dlg"><div class="dh"><b>🔔 Расписание звонков</b><button id="x">✕</button></div><div class="tabs" id="tabs"></div><div id="bc"></div></dialog>
  <dialog id="dlgA"><div class="dh"><b>⚙ Админ-панель</b><button id="xa">✕</button></div><div id="ac"></div></dialog>
  <dialog id="dlg2"><div class="dh"><b id="h2t"></b><button id="x2">✕</button></div><div id="h2c"></div></dialog>
</div>
<script>
const DAYS=["Понедельник","Вторник","Среда","Четверг","Пятница"];
const T={fk:["Физ.культура","Волков В.В."]};
// [пара, день(0-4), название, аудитория, недели, преподаватель]
const L=[
[1,0,"Физ.культура","","4,6,8,13-15","Волков В.В."],
[1,0,"МДК.05.01.","106л","5,7,9,16","Лукьянова С.П."],
[2,0,"МДК.05.01.","106л","1-13,15,16","Лукьянова С.П."],
[3,0,"МДК.05.02.","106л","1-13,16","Лукьянова С.П."],
[4,0,"МДК.05.03.","315л","1-12,17","Николаенко К.С."],

[1,1,"МДК.05.02.","106л","1-13,16","Лукьянова С.П."],
[2,1,"МДК.05.01.","106л","1-13,16","Лукьянова С.П."],
[2,1,"Ин.язык","409 / 314","14","Кривцова С.Н. / Степаненко О.А."],
[3,1,"МДК.05.01.","106л","1,3,6,8,10,12,13","Лукьянова С.П."],
[3,1,"ПОПД","412","2,4,5,7,9,11,14-17","Минина М.Х."],
[4,1,"Ин.язык","409 / 314","1,3,5-8,10,12,14-17","Кривцова С.Н. / Степаненко О.А."],
[5,1,"Физ.культура","","14,15,17","Волков В.В."],

[1,2,"Основы фил.","234","14,15,17","Волошина Т.К."],
[1,2,"МДК.05.02.","106л","13","Лукьянова С.П."],
[2,2,"ОПСО","321","1-17","Павлихина Е.В."],
[3,2,"Основы фил.","234","1-17","Волошина Т.К."],
[4,2,"Эконом. отр.","318","1-17","Ковзаренко Л.Н."],
[5,2,"МДК.05.03.","315л","1-17","Николаенко К.С."],

[1,3,"МДК.05.02.","106л","11,12,13,16","Лукьянова С.П."],
[1,3,"Физ.культура","","14,15,17","Волков В.В."],
[2,3,"МДК.05.01.","106л","1-17","Лукьянова С.П."],
[3,3,"ОПСО","321","1-8,14,15,17","Павлихина Е.В."],
[3,3,"МДК.05.01.","106л","13,16","Лукьянова С.П."],
[4,3,"МДК.05.03.","315л","1-12,17","Николаенко К.С."],
[4,3,"Ин.язык","409 / 314","14,15","Кривцова С.Н. / Степаненко О.А."],

[1,4,"МДК.05.01.","106л","2,4,9,11","Лукьянова С.П."],
[1,4,"Основы фил.","234","5,10,13-17","Волошина Т.К."],
[2,4,"МДК.05.02.","106л","1-17","Лукьянова С.П."],
[3,4,"ПОПД","412","1-17","Минина М.Х."],
[4,4,"Эконом. отр.","318","1,3,4,6-8,10,12-17","Ковзаренко Л.Н."],
[4,4,"Физ.культура","","2,9,11","Волков В.В."],
[5,4,"МДК.05.03.","315л","1-3,9,10,17","Николаенко К.С."],
[5,4,"МДК.05.01.","106л","11,12","Лукьянова С.П."]
];

function parseWeeks(s){const o=new Set();s.split(",").forEach(p=>{const[a,b]=p.split("-").map(Number);for(let i=a;i<=(b||a);i++)o.add(i)});return o}
L.forEach(l=>l.w=parseWeeks(l[4]));

const DAY=864e5;
const utc=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
let now=new Date(),dow,effDay,realWeek,todayIdx,inRange;
const year=2026; // расписание действует только в 2026 году
const sep1=new Date(year,8,1);
const mon1=utc(sep1)-((sep1.getDay()+6)%7)*DAY; // понедельник недели с 1 сентября
const START=Date.UTC(2026,8,1), END=Date.UTC(2026,11,31); // период: 1 сентября – 31 декабря 2026
const maxWeek=Math.floor((END-mon1)/DAY/7)+1; // последняя неделя, начинающаяся в 2026
function calcNow(){now=new Date();dow=(now.getDay()+6)%7;effDay=utc(now)+(dow>=5?(7-dow)*DAY:0);realWeek=Math.floor((effDay-mon1)/DAY/7)+1;todayIdx=dow;inRange=utc(now)>=START&&utc(now)<=END}
const homeW=()=>inRange?realWeek:(utc(now)<START?1:maxWeek);
calcNow();let week=homeW();

const fmt=t=>new Date(t).toLocaleDateString("ru-RU",{day:"numeric",month:"long",timeZone:"UTC"});

function render(){
  const start=mon1+(week-1)*7*DAY, end=start+4*DAY; // только будни (Пн–Пт)
  document.getElementById("num").textContent=week;
  document.getElementById("prev").disabled=week<=1;
  document.getElementById("next").disabled=week>=maxWeek;
  document.getElementById("range").textContent=fmt(start)+" – "+fmt(end);
  const sub=document.getElementById("sub");
  sub.textContent=(inRange&&week===realWeek?"Текущая неделя · ":"")+"учебный год 2026: с 1 сентября по 31 декабря"+(!inRange?" · сегодня вне периода расписания":"")+(week>17?" · занятий по расписанию нет":"");
  const isCur=inRange&&week===realWeek;
  const cp=curPair();
  let h="<thead><tr><th class='n'>№</th>";
  DAYS.forEach((d,i)=>{
    const dt=new Date(start+i*DAY);
    h+=`<th class="${isCur&&i===todayIdx?"today":""}">${d}${OV[iso(start+i*DAY)]?" ✎":""}<br><span style="font-weight:400;font-size:12px">${dt.toLocaleDateString("ru-RU",{day:"numeric",month:"short",timeZone:"UTC"})}</span></th>`;
  });
  h+="</tr></thead><tbody>";
  for(let p=1;p<=5;p++){
    h+=`<tr><td class="n">${p}</td>`;
    for(let d=0;d<5;d++){
      const dayT=start+d*DAY, off=dayT<START||dayT>END;
      const hol=HOL[iso(dayT)];
      if(hol){
        if(p===1){const n=hasLessons(d,mon1+(week-1)*7*DAY+d*DAY);
          h+=`<td rowspan="5" class="hol${isCur&&d===todayIdx?" today":""}">${holBox(hol,d,n)}</td>`;}
        continue;
      }
      const ls=off?[]:lessonsFor(p,d,mon1+(week-1)*7*DAY+d*DAY);
      h+=`<td class="${isCur&&d===todayIdx?"today":""}${off?" off":""}${cls(cp,d,p)}"${bat(cp,d,p)}>`+(ls.length?ls.map(l=>
        `${lesHtml(l)}`).join(""):`<div class="empty">—</div>`)+"</td>";
    }
    h+="</tr>";
  }
  document.getElementById("tbl").innerHTML=h+"</tbody>";
  let cs="";
  for(let d=0;d<5;d++){
    const dayT=start+d*DAY, off=dayT<START||dayT>END;
    const hol=HOL[iso(dayT)];
    let body="";
    if(hol)body=holBox(hol,d,hasLessons(d,mon1+(week-1)*7*DAY+d*DAY));
    for(let p=1;p<=5;p++){
      const ls=off?[]:lessonsFor(p,d,mon1+(week-1)*7*DAY+d*DAY);
      if(!ls.length||hol)continue;
      const br=G[gk(d)].rows.find(r=>r[0]===String(p));
      body+=`<div class="cp${cls(cp,d,p)}"${bat(cp,d,p)}><div class="ct"><b>${p} пара</b><span>${br?esc(br[1]):""}</span></div>`+ls.map(l=>`${lesHtml(l)}`).join("")+"</div>";
    }
    cs+=`<div class="dc${isCur&&d===todayIdx?" today":""}${off?" off":""}"><div class="dh2"><b>${DAYS[d]}${OV[iso(dayT)]?" ✎":""}</b><span>${fmt(dayT)}</span></div>${body||'<div class="empty">Занятий нет</div>'}</div>`;
  }
  document.getElementById("cards").innerHTML=cs;
}
document.getElementById("prev").onclick=()=>{if(week>1){week--;render()}};
document.getElementById("next").onclick=()=>{if(week<maxWeek){week++;render()}};
document.getElementById("cur").onclick=()=>{calcNow();week=homeW();render()};
// ===== Звонки =====
const G={
 mon:{name:"Понедельник",rows:[["Поднятие флага","8:15–8:25","по графику"],["Разговоры о важном","8:30–9:15","9:15–9:25"],["1","9:25–10:55","10:55–11:05"],["2","11:05–12:35","12:35–13:05",1],["3","13:05–14:35","14:35–14:45"],["4","14:45–16:15","16:15–16:25"],["5","16:25–17:55","17:55–18:05"],["6","18:05–19:35","—"]]},
 vsp:{name:"Вторник, среда, пятница",rows:[["1","8:30–10:00","10:00–10:10"],["2","10:10–11:40","11:40–12:10",1],["3","12:10–13:40","13:40–13:50"],["4","13:50–15:20","15:20–15:30"],["5","15:30–17:00","17:00–17:10"],["6","17:10–18:40","18:40–18:50"],["7","18:50–20:20","—"]]},
 thu:{name:"Четверг",rows:[["1","8:30–10:00","10:00–10:10"],["2","10:10–11:40","11:40–12:10",1],["Классный час","12:10–12:55","12:55–13:00"],["3","13:00–14:30","14:30–14:40"],["4","14:40–16:10","16:10–16:20"],["5","16:20–17:50","17:50–18:00"],["6","18:00–19:30","—"]]}
};
const gk=i=>i===0?"mon":i===3?"thu":"vsp";
const SHORT=["Пн","Вт","Ср","Чт","Пт"];
let bsel=todayIdx<5?todayIdx:0;
const mins=s=>{const[h,m]=s.split(":").map(Number);return h*60+m};
function btable(key,live){
  const nowM=now.getHours()*60+now.getMinutes();
  let h=`<table class="bt"><thead><tr><th>Пара</th><th>Занятия</th><th>Перемена</th></tr></thead><tbody>`;
  G[key].rows.forEach(r=>{
    const[a,b]=r[1].split("–");
    const cur=live&&nowM>=mins(a)&&nowM<mins(b);
    h+=`<tr class="${r[3]?"long ":""}${cur?"cur":""}"><td>${/^\d$/.test(r[0])?esc(r[0])+" пара":esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`;
  });
  return h+"</tbody></table>";
}
function renderBells(){
  let t=SHORT.map((s,i)=>`<button data-i="${i}" class="${bsel===i?"on":""}">${s}</button>`).join("");
  t+=`<button data-i="all" class="${bsel==="all"?"on":""}">Вся неделя</button>`;
  document.getElementById("tabs").innerHTML=t;
  let c="";
  if(bsel==="all"){
    c=["mon","vsp","thu"].map(k=>`<div class="bh">${esc(G[k].name)}</div>`+btable(k,false)).join("");
  }else{
    c=`<div class="bh">${DAYS[bsel]}</div>`+btable(gk(bsel),bsel===todayIdx);
  }
  document.getElementById("bc").innerHTML=c;
}
const dlg=document.getElementById("dlg");
document.getElementById("bells").onclick=()=>{bsel=todayIdx<5?todayIdx:0;renderBells();dlg.showModal()};
document.getElementById("x").onclick=()=>dlg.close();
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});
document.getElementById("tabs").onclick=e=>{const i=e.target.dataset.i;if(i===undefined)return;bsel=i==="all"?"all":+i;renderBells()};
// ===== Праздники (производственный календарь РФ 2026, сентябрь–декабрь) =====
const iso=t=>new Date(t).toISOString().slice(0,10);
const HOL={"2026-11-04":"День народного единства","2026-12-31":"Выходной день (перенос с 4 января)"};
function holBox(name,d,has){
  return `<div class="hb"><div class="hi">🎉</div><b>Занятий нет — праздник</b><div class="t">${name}</div>${has?`<button class="seeb" data-d="${d}">Увидеть расписание на этот день</button>`:""}</div>`;
}
const dlg2=document.getElementById("dlg2");
function openHol(d){
  const dayT=mon1+(week-1)*7*DAY+d*DAY;
  document.getElementById("h2t").textContent=DAYS[d]+", "+fmt(dayT);
  let c=`<div class="t" style="margin-bottom:10px">В этот день занятий нет из-за праздника. Пары, которые должны были быть:</div>`;
  for(let p=1;p<=5;p++){
    const ls=lessonsFor(p,d,mon1+(week-1)*7*DAY+d*DAY);
    if(!ls.length)continue;
    const br=G[gk(d)].rows.find(r=>r[0]===String(p));
    c+=`<div class="cp"><div class="ct"><b>${p} пара</b><span>${br?esc(br[1]):""}</span></div>`+ls.map(l=>`${lesHtml(l)}`).join("")+"</div>";
  }
  document.getElementById("h2c").innerHTML=c;
  dlg2.showModal();
}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest(".seeb");if(b)openHol(+b.dataset.d)});
document.getElementById("x2").onclick=()=>dlg2.close();
dlg2.addEventListener("click",e=>{if(e.target===dlg2)dlg2.close()});
// ===== Состояние с сервера, текущая пара, админ-панель =====
const cp0=o=>JSON.parse(JSON.stringify(o));
const G0=cp0(G);
// Данные расписания лежат в файле schedule.json в репозитории GitHub (репозиторий должен быть публичным).
const GH_REPO="s8lfov/Schedule_android",GH_BRANCH="main",GH_FILE="schedule.json";
const ADMINS=["s8lfov","deft-airspace"];
const DATA_URL="https://raw.githubusercontent.com/"+GH_REPO+"/"+GH_BRANCH+"/"+GH_FILE;
const ghH=t=>({"Authorization":"Bearer "+t,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
const IN_APP=location.protocol==="file:"; // внутри APK данные приходят только из приложения
let OV={},SH={},rev=0,tok=null,tuser="";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lg=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const ls=(k,v)=>{try{v===undefined?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function applyState(s){
  if(!s||typeof s!=="object")return false;
  for(const k of["mon","vsp","thu"]){const g=s.bells&&s.bells[k];G[k].rows=g&&Array.isArray(g.rows)?cp0(g.rows):cp0(G0[k].rows)}
  OV=s.ov&&typeof s.ov==="object"?s.ov:{};SH=s.sh&&typeof s.sh==="object"?s.sh:{};rev=+s.rev||0;return true;
}
applyState(lg("iv_state"));
{const t=lg("iv_gh");if(t&&t.token){tok=t.token;tuser=t.user}}
async function pull(){
  if(IN_APP)return;
  try{
    const r=await fetch(DATA_URL+"?t="+Math.floor(Date.now()/60000),{cache:"no-store"});
    if(!r.ok)return; // файла ещё нет или GitHub недоступен — остаётся то, что уже показано
    const s=await r.json();
    if((+s.rev||0)!==rev){applyState(s);ls("iv_state",s);render()}
  }catch(e){}
}
window.__setState=t=>{try{applyState(JSON.parse(t));render()}catch(e){}};
const lesHtml=l=>`<div class="les"><b>${esc(l[2])}</b>${l[3]?`<span class="r">каб. ${esc(l[3])}</span>`:""}<div class="t">${esc(l[5])}</div>${SH[l[2]+"|"+l[5]]?'<span class="shoe">👟 нужна сменка</span>':""}</div>`;
const weekOf=t=>Math.floor((t-mon1)/DAY/7)+1;
function lessonsFor(p,d,t){const o=OV[iso(t)];if(o)return(o[p]||[]).map(x=>[p,d,x[0],x[1],"",x[2]]);return L.filter(l=>l[0]===p&&l[1]===d&&l.w.has(weekOf(t)))}
function hasLessons(d,t){return[1,2,3,4,5].some(p=>lessonsFor(p,d,t).length)}
function curPair(){
  if(!(inRange&&week===realWeek)||todayIdx>4||HOL[iso(utc(now))])return null;
  const m=now.getHours()*60+now.getMinutes(),t=utc(now);let nx=null;
  for(const r of G[gk(todayIdx)].rows){
    if(!/^\d$/.test(r[0]))continue;
    const[a,b]=r[1].split("–"),p=+r[0];
    if(m>=mins(a)&&m<mins(b)&&lessonsFor(p,todayIdx,t).length)return{p,s:"now",t:b};
    if(m<mins(a)&&!nx&&lessonsFor(p,todayIdx,t).length)nx={p,s:"next",t:a};
  }
  return nx;
}
const cls=(c,d,p)=>c&&d===todayIdx&&c.p===p?" "+c.s:"";
const bat=(c,d,p)=>c&&d===todayIdx&&c.p===p?` data-b="${c.s==="now"?"идёт до ":"следующая в "}${esc(c.t)}"`:"";
function tickNow(){const was=week===realWeek;calcNow();if(was)week=homeW();render()}
setInterval(()=>{if(!document.hidden)tickNow()},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tickNow()});

setInterval(()=>{if(!document.hidden)pull()},90000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
pull();
const b64e=t=>btoa(unescape(encodeURIComponent(t)));
const b64d=t=>decodeURIComponent(escape(atob(t.replace(/\s/g,""))));
async function push(){
  const url="https://api.github.com/repos/"+GH_REPO+"/contents/"+GH_FILE;
  const revert=async()=>{rev=-1;await pull()};
  try{
    const g=await fetch(url+"?ref="+GH_BRANCH+"&t="+Date.now(),{headers:ghH(tok),cache:"no-store"});
    if(g.status===401){tok=null;ls("iv_gh");await revert();return"Токен недействителен — войдите снова"}
    let sha,srv=null;
    if(g.ok){const j=await g.json();sha=j.sha;try{srv=JSON.parse(b64d(j.content))}catch(e){srv=null}}
    else if(g.status!==404){await revert();return"Ошибка чтения ("+g.status+")"}
    const cur=srv?(+srv.rev||0):0;
    if(cur!==rev){if(srv){applyState(srv);ls("iv_state",srv);render()}return"Расписание только что изменил другой админ. Данные обновлены — повторите правку"}
    const next={rev:cur+1,bells:{mon:G.mon,vsp:G.vsp,thu:G.thu},ov:OV,sh:SH,by:tuser,at:new Date().toISOString()};
    const body={message:"Расписание: правка от "+tuser,content:b64e(JSON.stringify(next)),branch:GH_BRANCH};
    if(sha)body.sha=sha;
    const p=await fetch(url,{method:"PUT",headers:{...ghH(tok),"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(p.status===409||p.status===422){await revert();return"Конфликт сохранения — повторите правку"}
    if(p.status===403||p.status===404){await revert();return"Нет прав на запись. У токена должно быть разрешение Contents: Read and write"}
    if(!p.ok){await revert();return"Ошибка сохранения ("+p.status+")"}
    applyState(next);ls("iv_state",next);render();
    return"Сохранено. У друзей обновится в течение пары минут";
  }catch(e){return"Нет связи с GitHub"}
}
const dlgA=document.getElementById("dlgA"),ac=document.getElementById("ac");
let atab="day",aiso="",edit={},bedit={},she={},amsg="";
const dIdx=t=>(new Date(t).getUTCDay()+6)%7;
function defaultIso(){const t=utc(now)+(dow>=5?(7-dow)*DAY:0);return iso(Math.min(Math.max(t,START),END))}
function loadDay(){const t=Date.parse(aiso+"T00:00:00Z");edit={};if(isNaN(t)||dIdx(t)>4)return;for(let p=1;p<=5;p++)edit[p]=lessonsFor(p,dIdx(t),t).map(l=>[l[2],l[3],l[5]])}
function dayHtml(){
  const t=Date.parse(aiso+"T00:00:00Z");
  let h=`<div class="ar"><input type="date" id="ad" value="${esc(aiso)}" min="2026-09-01" max="2026-12-31"></div>`;
  if(isNaN(t)||dIdx(t)>4)return h+`<div class="t">Выберите будний день.</div>`;
  h+=`<div class="t">${DAYS[dIdx(t)]}${OV[aiso]?" · изменено вручную":""}${HOL[aiso]?" · праздник: "+HOL[aiso]:""}</div>`;
  for(let p=1;p<=5;p++)h+=`<div class="ap"><b>${p} пара</b>`+(edit[p]||[]).map((x,i)=>`<div class="lr" data-p="${p}"><input placeholder="Предмет" maxlength="100" value="${esc(x[0])}"><input class="s" placeholder="Каб." maxlength="30" value="${esc(x[1])}"><input placeholder="Преподаватель" maxlength="100" value="${esc(x[2])}"><button data-a="del" data-p="${p}" data-i="${i}">✕</button></div>`).join("")+`<button data-a="add" data-p="${p}">+ добавить</button></div>`;
  return h+`<div class="ar"><button class="seeb" data-a="saveday">Сохранить день</button><button data-a="resetday">Вернуть по умолчанию</button></div>`;
}
function bellsHtml(){
  return["mon","vsp","thu"].map(k=>`<div class="ap"><b>${esc(G[k].name)}</b>`+bedit[k].map((r,i)=>`<div class="br" data-g="${k}"><input class="s" value="${esc(r[0])}" title="№ пары или название"><input value="${esc(r[1])}" placeholder="9:25–10:55"><input value="${esc(r[2])}" placeholder="перемена"><label class="t"><input type="checkbox" ${r[3]?"checked":""}>бол.</label><button data-a="bdel" data-g="${k}" data-i="${i}">✕</button></div>`).join("")+`<button data-a="badd" data-g="${k}">+ строка</button></div>`).join("")+`<div class="ar"><button class="seeb" data-a="savebells">Сохранить звонки</button><button data-a="resetbells">Стандартные</button></div><div class="t">Время: 9:25–10:55. Строки с цифрой в первом поле считаются парами и используются для подсветки текущей пары.</div>`;
}
function tagsHtml(){
  const m=new Map();
  L.forEach(l=>m.set(l[2]+"|"+l[5],[l[2],l[5]]));
  Object.values(OV).forEach(d=>{for(const p in d)d[p].forEach(x=>m.set(x[0]+"|"+x[2],[x[0],x[2]]))});
  return`<div class="t">Метка «нужна сменка» привязана к предмету и преподавателю: она показывается у всех пар с таким сочетанием.</div>`+[...m].sort((a,b)=>a[0].localeCompare(b[0],"ru")).map(([k,v])=>`<label class="tg"><input type="checkbox" data-k="${esc(k)}" ${she[k]?"checked":""}><span><b>${esc(v[0])}</b> · ${esc(v[1])}</span></label>`).join("")+`<div class="ar"><button class="seeb" data-a="savetags">Сохранить метки</button></div>`;
}
function dataHtml(){
  return`<div class="t">Здесь можно скопировать всё расписание текстом (резервная копия) или вставить новое и нажать «Загрузить».</div><textarea id="ajson" rows="8">${esc(JSON.stringify({bells:{mon:G.mon,vsp:G.vsp,thu:G.thu},ov:OV,sh:SH}))}</textarea><div class="ar"><button class="seeb" data-a="import">Загрузить</button><button data-a="resetall">Сбросить всё</button><button data-a="logout">Выйти</button></div>`;
}
function drawAdmin(){
  if(!tok){ac.innerHTML=`<div class="t">Вход для администраторов (${ADMINS.join(", ")}). Вставьте токен доступа GitHub — он запоминается на этом устройстве.</div><div class="t"><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Создать токен</a>: доступ только к репозиторию «${esc(GH_REPO.split("/")[1])}», право Contents → Read and write.</div><div class="ar"><input id="lp" type="password" placeholder="Токен GitHub" autocomplete="off"><button data-a="login">Войти</button></div><div class="am">${esc(amsg)}</div>`;return}
  const tabs=[["day","Пары на день"],["tags","Метки"],["bells","Звонки"],["data","Данные"]].map(([k,n])=>`<button data-a="tab" data-k="${k}" class="${atab===k?"on":""}">${n}</button>`).join("");
  ac.innerHTML=`<div class="t">Вы вошли как <b>${esc(tuser)}</b></div><div class="tabs">${tabs}</div>${atab==="day"?dayHtml():atab==="bells"?bellsHtml():atab==="tags"?tagsHtml():dataHtml()}<div class="am">${esc(amsg)}</div>`;
}
function collect(){
  if(atab==="day"){const e={};for(let p=1;p<=5;p++)e[p]=[];ac.querySelectorAll(".lr").forEach(r=>{const i=r.querySelectorAll("input");e[r.dataset.p].push([i[0].value.trim(),i[1].value.trim(),i[2].value.trim()])});edit=e}
  else if(atab==="bells"){const e={mon:[],vsp:[],thu:[]};ac.querySelectorAll(".br").forEach(r=>{const i=r.querySelectorAll("input"),row=[i[0].value.trim(),i[1].value.trim(),i[2].value.trim()];if(i[3].checked)row.push(1);e[r.dataset.g].push(row)});bedit=e}
  else if(atab==="tags"){const n={};ac.querySelectorAll(".tg input").forEach(i=>{if(i.checked)n[i.dataset.k]=1});she=n}
}
const bellsCopy=()=>({mon:cp0(G.mon.rows),vsp:cp0(G.vsp.rows),thu:cp0(G.thu.rows)});
ac.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b||!b.dataset.a)return;
  const a=b.dataset.a;amsg="";
  if(a==="login"){
    const t=document.getElementById("lp").value.trim();
    try{
      const r=await fetch("https://api.github.com/user",{headers:ghH(t)});
      if(!r.ok)amsg=r.status===401?"Токен не подошёл":"Ошибка GitHub ("+r.status+")";
      else{
        const u=(await r.json()).login||"";
        if(!ADMINS.includes(u.toLowerCase()))amsg="Аккаунт "+u+" не входит в список админов";
        else{
          const rr=await fetch("https://api.github.com/repos/"+GH_REPO,{headers:ghH(t)});
          const info=rr.ok?await rr.json():null;
          if(!info||!info.permissions||!info.permissions.push)amsg="У аккаунта нет права записи в репозиторий";
          else{tok=t;tuser=u;ls("iv_gh",{token:t,user:u});aiso=defaultIso();loadDay();she=cp0(SH)}
        }
      }
    }catch(x){amsg="Нет связи с GitHub"}
    drawAdmin();return;
  }
  if(tok&&a!=="resetall"&&a!=="import"&&a!=="logout")collect();
  if(a==="tab"){atab=b.dataset.k;if(atab==="day")loadDay();if(atab==="bells")bedit=bellsCopy();if(atab==="tags")she=cp0(SH)}
  else if(a==="add")edit[b.dataset.p].push(["","",""]);
  else if(a==="del")edit[b.dataset.p].splice(+b.dataset.i,1);
  else if(a==="saveday"){const o={};for(let p=1;p<=5;p++)o[p]=edit[p].filter(x=>x[0]);OV[aiso]=o;amsg=await push()}
  else if(a==="resetday"){delete OV[aiso];amsg=await push();loadDay()}
  else if(a==="badd")bedit[b.dataset.g].push(["","",""]);
  else if(a==="bdel")bedit[b.dataset.g].splice(+b.dataset.i,1);
  else if(a==="savebells"){
    for(const k in bedit)for(const r of bedit[k]){if(!r[0]&&!r[1])continue;r[1]=r[1].replace(/\s/g,"").replace(/[-—]/,"–");if(!/^\d{1,2}:\d{2}–\d{1,2}:\d{2}$/.test(r[1])){amsg="Неверное время в строке «"+r[0]+"»";break}}
    if(!amsg){for(const k in bedit)G[k].rows=bedit[k].filter(r=>r[0]&&r[1]);amsg=await push()}}
  else if(a==="resetbells"){["mon","vsp","thu"].forEach(k=>G[k].rows=cp0(G0[k].rows));amsg=await push();bedit=bellsCopy()}
  else if(a==="savetags"){SH=cp0(she);amsg=await push()}
  else if(a==="import"){try{
    const j=JSON.parse(document.getElementById("ajson").value);
    for(const k of["mon","vsp","thu"])if(!j.bells||!j.bells[k]||!Array.isArray(j.bells[k].rows))throw 0;
    for(const k of["mon","vsp","thu"])G[k].rows=cp0(j.bells[k].rows);
    OV=j.ov&&typeof j.ov==="object"?j.ov:{};SH=j.sh&&typeof j.sh==="object"?j.sh:{};
    amsg=await push()}catch(x){amsg="Неверный формат данных"}}
  else if(a==="logout"){tok=null;tuser="";ls("iv_gh")}
  else if(a==="resetall"){
    if(!b.dataset.c){b.dataset.c=1;b.textContent="Нажмите ещё раз";return}
    ["mon","vsp","thu"].forEach(k=>G[k].rows=cp0(G0[k].rows));OV={};SH={};amsg=await push()}
  drawAdmin();
});
ac.addEventListener("change",e=>{if(e.target.id==="ad"){aiso=e.target.value;amsg="";loadDay();drawAdmin()}});
document.getElementById("admbtn").onclick=()=>{amsg="";if(tok){aiso=defaultIso();loadDay();she=cp0(SH)}drawAdmin();dlgA.showModal()};
if(IN_APP)document.getElementById("admbtn").style.display="none";
document.getElementById("xa").onclick=()=>dlgA.close();
dlgA.addEventListener("click",e=>{if(e.target===dlgA)dlgA.close()});
render();
</script>
